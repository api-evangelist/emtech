name: EMTECH
description: EMTECH is a financial-technology company founded in 2019 that modernizes
  financial market infrastructure for central banks, financial regulators, and financial
  service providers. Its Beyond Suite delivers regulatory sandbox management (Beyond
  Sandbox), digital cash and central bank digital currency infrastructure (Beyond
  Cash), automated compliance operations (Beyond Compliance), and risk-based supervision
  (Beyond Supervision), exposed through regulatory-reporting and data-ingestion APIs
  for microlending, remittance, payments, virtual assets, crowdfunding, consumer protection,
  and a CBDC simulator. EMTECH works with African central banks including the Bank
  of Ghana, the Central Bank of Nigeria, and Liberia, and is SOC 2 and ISO 27001 certified.
